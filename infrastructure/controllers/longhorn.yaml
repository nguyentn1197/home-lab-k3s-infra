---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.7.x"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h
  values:
    defaultSettings:
      # Replicas & placement
      defaultReplicaCount: 2
      defaultDataLocality: best-effort   # schedule a local replica on the same node as the pod
      replicaAutoBalance: best-effort    # rebalance replicas when nodes are added/removed
      # Storage is contended (Loki/Prometheus/DB replicas overlapping on the same
      # disks) - give replicas more time before the engine reports I/O as failed.
      engineReplicaTimeout: 30
      # Reliability
      autoSalvage: true                  # auto-recover faulted volumes
      autoDeletePodWhenVolumeDetachedUnexpectedly: true
      # Backups
      backupTarget: "cifs://10.10.0.210/nas_share/LONGHORN_BACKUP"   # e.g. cifs://192.168.1.10/longhorn-backup
      backupTargetCredentialSecret: longhorn-backup-cifs
      backupCompressionMethod: lz4       # fast compression for backup data
      # Snapshots
      snapshotDataIntegrity: fast-check  # periodic hash checks on snapshot data
      recurringSuccessfulJobsHistoryLimit: 3
      recurringFailedJobsHistoryLimit: 1
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
      defaultDataLocality: best-effort
      reclaimPolicy: Retain              # keep volume data if PVC is deleted accidentally
      recurringJobSelector:
        enable: true
        jobList: '[{"name":"default","isGroup":true}]'
    ingress:
      enabled: false
  # The Longhorn chart has no values.yaml knob for its own components'
  # resource requests/limits, which let ~15 of its pods (manager DaemonSet,
  # CSI sidecars, driver-deployer, UI) run with zero requests cluster-wide -
  # one contributor to worker-3's resource-starvation incident. Patch them in
  # post-render instead.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: longhorn-manager
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: longhorn-manager
                        resources:
                          requests:
                            cpu: 100m
                            memory: 300Mi
                          limits:
                            memory: 500Mi
          - target:
              kind: DaemonSet
              name: longhorn-csi-plugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-csi-plugin
              spec:
                template:
                  spec:
                    containers:
                      - name: longhorn-csi-plugin
                        resources:
                          requests:
                            cpu: 50m
                            memory: 64Mi
                          limits:
                            memory: 128Mi
                      - name: node-driver-registrar
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            memory: 32Mi
                      - name: longhorn-liveness-probe
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            memory: 32Mi
          - target:
              kind: Deployment
              name: csi-attacher
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: csi-attacher
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-attacher
                        resources:
                          requests:
                            cpu: 20m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
          - target:
              kind: Deployment
              name: csi-provisioner
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: csi-provisioner
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-provisioner
                        resources:
                          requests:
                            cpu: 20m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
          - target:
              kind: Deployment
              name: csi-resizer
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: csi-resizer
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-resizer
                        resources:
                          requests:
                            cpu: 20m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
          - target:
              kind: Deployment
              name: csi-snapshotter
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: csi-snapshotter
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-snapshotter
                        resources:
                          requests:
                            cpu: 20m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
          - target:
              kind: Deployment
              name: longhorn-driver-deployer
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-driver-deployer
              spec:
                template:
                  spec:
                    containers:
                      - name: longhorn-driver-deployer
                        resources:
                          requests:
                            cpu: 20m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
          - target:
              kind: Deployment
              name: longhorn-ui
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-ui
              spec:
                template:
                  spec:
                    containers:
                      - name: longhorn-ui
                        resources:
                          requests:
                            cpu: 20m
                            memory: 64Mi
                          limits:
                            memory: 128Mi
