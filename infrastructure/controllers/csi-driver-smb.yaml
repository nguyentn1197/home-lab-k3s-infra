---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-smb
  namespace: flux-system
spec:
  interval: 24h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
---
# Mounts the NAS SMB share into pods so logical (pg_dump) backups land as plain
# files on the NAS, readable without Kubernetes or Longhorn. Longhorn's CIFS
# backup target is a separate path and is unaffected by this driver.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: csi-driver-smb
      version: "1.20.x"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
        namespace: flux-system
      interval: 12h
