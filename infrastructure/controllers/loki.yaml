---
# Loki is deployed in Monolithic (single-binary) mode with filesystem storage
# on a Longhorn PVC: a single replica, not HA, but fully recoverable on
# restart/reschedule because all chunks + index live on the PVC.
# NOTE: the OSS Loki chart moved to grafana-community/helm-charts (Mar 2026).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: "17.x"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 12h
  values:
    deploymentMode: Monolithic
    loki:
      auth_enabled: false   # single tenant, internal-only
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 720h   # 30 days
        allow_structured_metadata: true
        volume_enabled: true
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      pattern_ingester:
        enabled: true
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 30Gi   # Longhorn (default StorageClass)
    # The nginx gateway is the single stable entrypoint for both in-cluster
    # writers (Alloy) and external writers (via HTTPRoute), and for Grafana
    # queries: http://loki-gateway.monitoring.svc.cluster.local
    gateway:
      enabled: true
    # Trim the homelab footprint: the cache statefulsets default to ~8Gi
    # memory each, and the canary isn't needed at this scale.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    # Zero out components of the other deployment modes.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0
