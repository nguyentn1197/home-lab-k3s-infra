---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "86.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # Alertmanager's SMTP username has no file-based config field (unlike the
  # password — the operator rejects `smtp_auth_username_file`, confirmed via
  # its reconcile logs), so it can't be mounted as a secret file like the
  # password is. Instead, inject it straight into the rendered Helm values
  # from the Infisical-synced `alertmanager-smtp` Secret at release time —
  # it still never appears in Git.
  valuesFrom:
    - kind: Secret
      name: alertmanager-smtp
      valuesKey: SMTP_USERNAME
      targetPath: alertmanager.config.global.smtp_auth_username
  values:
    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 15d
        retentionSize: 45GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi   # Longhorn (default StorageClass, 2 replicas)
        # Pick up ServiceMonitors / PodMonitors / Probes / Rules / ScrapeConfigs
        # from ALL namespaces regardless of helm release labels. This is what
        # lets us drop ScrapeConfig CRDs in infrastructure/configs/ for
        # external (non-cluster) targets like docker-host cadvisor or VM
        # node_exporter without touching this file.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
    alertmanager:
      enabled: true
      alertmanagerSpec:
        replicas: 1
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        # Mounts the Infisical-synced `alertmanager-smtp` Secret's keys as
        # files under /etc/alertmanager/secrets/alertmanager-smtp/<key>, for
        # use with smtp_auth_password_file below. Keeps the password out of
        # Git/Helm values — see infrastructure/configs/monitoring-alertmanager-smtp.yaml.
        secrets:
          - alertmanager-smtp
      # Alertmanager routing/receivers config. Alerts previously all went to
      # the "null" receiver (fired but discarded) — now routed to email.
      config:
        global:
          resolve_timeout: 5m
          # Resend SMTP relay, STARTTLS on 587.
          smtp_smarthost: "smtp.resend.com:587"
          smtp_from: "kube-monitoring@tnndev.com"
          # smtp_auth_username is injected via valuesFrom above (from the
          # Infisical-synced `alertmanager-smtp` Secret) — not set here.
          smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/SMTP_PASSWORD
          smtp_require_tls: true
        inhibit_rules:
          - equal:
              - namespace
              - alertname
            source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
          - equal:
              - namespace
              - alertname
            source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
          - equal:
              - namespace
            source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
          - target_matchers:
              - alertname = InfoInhibitor
        route:
          group_by: ["namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "email"
          routes:
            # Watchdog is a synthetic always-firing heartbeat alert used to
            # confirm the pipeline is alive — routing it to email would send
            # a message every repeat_interval forever, so it stays silenced.
            - matchers:
                - alertname = "Watchdog"
              receiver: "null"
        receivers:
          - name: "null"
          - name: "email"
            email_configs:
              # TODO: replace with the address that should receive alerts.
              - to: "nguyen.tn.1197@gmail.com"
                send_resolved: true
        templates:
          - /etc/alertmanager/config/*.tmpl
    grafana:
      enabled: true
      fullnameOverride: grafana
      # Single replica + PVC: not HA, but dashboards/users survive restarts.
      # Recreate strategy avoids RWO multi-attach errors on upgrades.
      persistence:
        enabled: true
        type: pvc
        size: 2Gi
      deploymentStrategy:
        type: Recreate
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local
      # Default admin password is auto-generated into the
      # `grafana` Secret (kubectl -n monitoring get secret grafana -o ...).
      # Swap to an InfisicalSecret + admin.existingSecret if desired.
    prometheus-node-exporter:
      # Masters carry CriticalAddonsOnly=true:NoExecute; we still want
      # node metrics from them.
      tolerations:
        - operator: Exists
    # K3s runs controller-manager/scheduler/proxy/etcd embedded and does not
    # expose their metrics endpoints by default — disable these scrapes to
    # avoid permanently-down targets and false TargetDown alerts.
    # (kubelet + cadvisor + apiserver scraping still works normally.)
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
