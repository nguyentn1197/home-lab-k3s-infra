---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  addresses:
    - type: IPAddress
      value: "10.10.40.2"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.kube.local.tnndev.com"
      allowedRoutes:
        namespaces:
          from: All
