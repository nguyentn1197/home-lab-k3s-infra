---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-backup-retention
  namespace: cnpg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-backup-retention
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - scheduledbackups
    verbs:
      - get
      - list
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
    verbs:
      - get
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-backup-retention
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-backup-retention
subjects:
  - kind: ServiceAccount
    name: cnpg-backup-retention
    namespace: cnpg-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-backup-retention
  namespace: cnpg-system
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cnpg-backup-retention
          restartPolicy: Never
          containers:
            - name: retention
              image: alpine/k8s:1.30.14
              command:
                - /bin/sh
                - -ceu
                - |
                  # List all ScheduledBackups that carry a retention label (any value).
                  # go-template handles the "/" in the label key reliably.
                  kubectl get scheduledbackups.postgresql.cnpg.io --all-namespaces \
                    -l 'homelab.tnndev.com/cnpg-retention' \
                    -o go-template \
                    --template='{{range .items}}{{.metadata.namespace}} {{.metadata.name}} {{index .metadata.labels "homelab.tnndev.com/cnpg-retention"}}{{"\n"}}{{end}}' |
                  while read -r namespace schedule_name retention_label; do
                    if [ -z "${namespace}" ] || [ -z "${schedule_name}" ] || [ -z "${retention_label}" ]; then
                      continue
                    fi

                    # Parse "7d" -> 7; skip if the label value is not a plain number followed by "d".
                    retention_days="${retention_label%d}"
                    if ! echo "${retention_days}" | grep -qE '^[0-9]+$'; then
                      echo "Skipping ${namespace}/${schedule_name}: unrecognised retention label '${retention_label}'"
                      continue
                    fi

                    # BusyBox date does not support "-d '7 days ago'"; use arithmetic instead.
                    cutoff_epoch="$(( $(date -u +%s) - retention_days * 86400 ))"

                    kubectl get backups.postgresql.cnpg.io -n "${namespace}" \
                      -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{" "}{.status.stoppedAt}{" "}{range .metadata.ownerReferences[*]}{.kind}{":"}{.name}{","}{end}{"\n"}{end}' |
                    while read -r backup_name phase stopped_at owners; do
                      case "${owners}" in
                        *"ScheduledBackup:${schedule_name},"*) ;;
                        *) continue ;;
                      esac

                      if [ "${phase}" != "completed" ] || [ -z "${stopped_at}" ]; then
                        continue
                      fi

                      # Strip trailing Z and any fractional seconds so BusyBox date can parse it.
                      stopped_at_base="${stopped_at%Z}"
                      stopped_at_base="${stopped_at_base%%.*}"
                      stopped_epoch="$(date -u -D "%Y-%m-%dT%H:%M:%S" -d "${stopped_at_base}" +%s 2>/dev/null || echo 0)"
                      if [ "${stopped_epoch}" -gt 0 ] && [ "${stopped_epoch}" -lt "${cutoff_epoch}" ]; then
                        echo "Deleting ${namespace}/${backup_name} (older than ${retention_days}d)"
                        kubectl delete backup.postgresql.cnpg.io -n "${namespace}" "${backup_name}"
                      fi
                    done
                  done
