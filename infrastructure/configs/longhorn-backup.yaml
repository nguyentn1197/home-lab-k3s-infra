---
# Syncs CIFS backup credentials from Infisical into longhorn-system.
# Infisical keys at path /longhorn/backup-cred-cifs: LONGHORN_BACKUP_CIFS_USERNAME, LONGHORN_BACKUP_CIFS_PASSWORD
# Remapped to: CIFS_USERNAME, CIFS_PASSWORD (required by Longhorn)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: longhorn-backup-cifs
  namespace: longhorn-system
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: home-lab-k3s
        envSlug: prod
        secretsPath: "/longhorn/backup-cred-cifs"
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical-operator-system
  managedKubeSecretReferences:
    - secretName: longhorn-backup-cifs
      secretNamespace: longhorn-system
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          CIFS_USERNAME: "{{ .LONGHORN_BACKUP_CIFS_USERNAME.Value }}"
          CIFS_PASSWORD: "{{ .LONGHORN_BACKUP_CIFS_PASSWORD.Value }}"
