---
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
---
# Infisical keys at path /authentik/app:
# AUTHENTIK_SECRET_KEY
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-app-secrets
  namespace: authentik
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 30
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: home-lab-k3s
        envSlug: prod
        secretsPath: "/authentik/app"
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical-operator-system
  managedKubeSecretReferences:
    - secretName: authentik-app-secrets
      secretNamespace: authentik
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY.Value }}"
          AUTHENTIK_EMAIL__PASSWORD: "{{ .RESEND_SMTP_PASSWORD.Value }}"
---
# Infisical keys at path /authentik/postgres:
# AUTHENTIK_POSTGRES_USERNAME, AUTHENTIK_POSTGRES_PASSWORD
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-postgres-secrets
  namespace: authentik
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 30
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: home-lab-k3s
        envSlug: prod
        secretsPath: "/authentik/postgres"
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical-operator-system
  managedKubeSecretReferences:
    - secretName: authentik-postgres-secrets
      secretNamespace: authentik
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          AUTHENTIK_POSTGRESQL__USER: "{{ .AUTHENTIK_POSTGRES_USERNAME.Value }}"
          AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .AUTHENTIK_POSTGRES_PASSWORD.Value }}"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      version: "2026.8.x"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-db-rw.postgres-authentik.svc.cluster.local
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_WEB__BASE_URL
          value: https://authentik.tnndev.com
        - name: AUTHENTIK_LOG_LEVEL
          value: info
      envFrom:
        - secretRef:
            name: authentik-app-secrets
        - secretRef:
            name: authentik-postgres-secrets
    authentik:
      error_reporting:
        enabled: false
      email:
        host: "smtp.resend.com"
        port: 587
        username: "resend"
        use_tls: true
        use_ssl: false
        from: "authentik homelab <authentik-noreply@tnndev.com>"
    postgresql:
      enabled: false
    worker:
      # ndots:1 makes the resolver try the DB FQDN as-is instead of walking the search
      # list first. Without this, pods scheduled on worker-1 (host search domain
      # local.tnndev.com) have authentik-db-rw...svc.cluster.local (5 dots, matches
      # default ndots:5) hijacked by the wildcard *.local.tnndev.com -> Caddy at
      # 10.10.20.204, so the worker can never reach postgres and crashloops forever.
      # Same root cause as the cloudflared-authentik fix in commit 12be047.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    server:
      # Two replicas on different nodes so a single worker reboot doesn't take
      # SSO down (it was out ~4 min on the 2026-11-22 worker-2 reboot). The
      # server is stateless (sessions live in Postgres). Request sized from the
      # 7d peak (~741Mi); previously it had no request at all.
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: authentik
                    app.kubernetes.io/component: server
      pdb:
        enabled: true
        minAvailable: 1
      # Same ndots:1 fix as worker above, in case this pod ever lands on worker-1.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      route:
        main:
          enabled: true
          hostnames:
            - authentik.kube.local.tnndev.com
          parentRefs:
            - name: homelab
              namespace: envoy-gateway-system
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: X-Forwarded-Proto
                    value: "https"
                  - name: X-Forwarded-Scheme
                    value: "https"
                  - name: X-Forwarded-Port
                    value: "443"
