apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-authentik-liveness
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  authentik-liveness.json: |
    {
      "id": null,
      "uid": "authentik-liveness",
      "title": "Authentik & authentik-db Liveness",
      "tags": [
        "authentik",
        "cnpg",
        "liveness"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Authentik pods",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "table",
          "title": "Pod status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "max by (pod, phase) (kube_pod_status_phase{namespace=\"authentik\"} == 1)",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "phase": "Phase"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "Running": {
                      "color": "green",
                      "index": 0
                    },
                    "Pending": {
                      "color": "yellow",
                      "index": 1
                    },
                    "Failed": {
                      "color": "red",
                      "index": 2
                    },
                    "Unknown": {
                      "color": "red",
                      "index": 3
                    }
                  }
                }
              ],
              "custom": {
                "cellOptions": {
                  "type": "color-background"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "bargauge",
          "title": "Container restarts (total)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "expr": "max by (pod) (kube_pod_container_status_restarts_total{namespace=\"authentik\"})",
              "instant": true,
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pod uptime",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "expr": "time() - max by (pod) (kube_pod_start_time{namespace=\"authentik\"})",
              "instant": true,
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Restart rate (1h window)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"authentik\"}[1h]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Last termination reason",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "expr": "max by (pod, container, reason) (kube_pod_container_status_last_terminated_reason{namespace=\"authentik\"} == 1)",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "container": "Container",
                  "reason": "Reason"
                }
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "CPU usage",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"authentik\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Memory working set",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"authentik\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 200,
          "type": "row",
          "title": "authentik-db (CNPG cluster)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 25
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 8,
          "type": "table",
          "title": "Pod status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 26
          },
          "targets": [
            {
              "expr": "max by (pod, phase) (kube_pod_status_phase{namespace=\"postgres-authentik\", pod=~\"authentik-db-[0-9]+\"} == 1)",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "phase": "Phase"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "Running": {
                      "color": "green",
                      "index": 0
                    },
                    "Pending": {
                      "color": "yellow",
                      "index": 1
                    },
                    "Failed": {
                      "color": "red",
                      "index": 2
                    },
                    "Unknown": {
                      "color": "red",
                      "index": 3
                    }
                  }
                }
              ],
              "custom": {
                "cellOptions": {
                  "type": "color-background"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Instance role",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 26
          },
          "targets": [
            {
              "expr": "max by (pod) (cnpg_pg_replication_in_recovery{namespace=\"postgres-authentik\"})",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "Value": "Role"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Primary",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "Replica",
                      "color": "blue",
                      "index": 1
                    }
                  }
                }
              ],
              "custom": {
                "cellOptions": {
                  "type": "color-background"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Exporter / instance up",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 26
          },
          "targets": [
            {
              "expr": "cnpg_collector_up{namespace=\"postgres-authentik\"}",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "Value": "Up"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "custom": {
                "cellOptions": {
                  "type": "color-background"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Replication lag",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 34
          },
          "targets": [
            {
              "expr": "cnpg_pg_replication_lag{namespace=\"postgres-authentik\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "bargauge",
          "title": "Container restarts (total)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 34
          },
          "targets": [
            {
              "expr": "max by (pod) (kube_pod_container_status_restarts_total{namespace=\"postgres-authentik\", pod=~\"authentik-db-[0-9]+\"})",
              "instant": true,
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal"
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "CPU usage",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 42
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"postgres-authentik\", pod=~\"authentik-db-[0-9]+\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Memory working set",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 42
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"postgres-authentik\", pod=~\"authentik-db-[0-9]+\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        }
      ]
    }
