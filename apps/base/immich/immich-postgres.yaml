---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-immich
---
# Infisical keys at path /immich/postgres:
# IMMICH_POSTGRES_USERNAME, IMMICH_POSTGRES_PASSWORD
# CNPG requires the rendered username to match bootstrap.initdb.owner.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: immich-db-app
  namespace: postgres-immich
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 30
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: home-lab-k3s
        envSlug: prod
        secretsPath: "/immich/postgres"
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical-operator-system
  managedKubeSecretReferences:
    - secretName: immich-db-app
      secretNamespace: postgres-immich
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          username: "{{ .IMMICH_POSTGRES_USERNAME.Value }}"
          password: "{{ .IMMICH_POSTGRES_PASSWORD.Value }}"
