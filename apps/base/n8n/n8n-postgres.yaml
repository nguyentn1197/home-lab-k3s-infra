---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-n8n
---
# Infisical keys at path /n8n/postgres:
# N8N_POSTGRES_USERNAME (must be "n8n" — CNPG requires the rendered
# username to match bootstrap.initdb.owner), N8N_POSTGRES_PASSWORD
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: n8n-db-app
  namespace: postgres-n8n
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 30
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: home-lab-k3s
        envSlug: prod
        secretsPath: "/n8n/postgres"
        recursive: false
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: infisical-operator-system
  managedKubeSecretReferences:
    - secretName: n8n-db-app
      secretNamespace: postgres-n8n
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          username: "{{ .N8N_POSTGRES_USERNAME.Value }}"
          password: "{{ .N8N_POSTGRES_PASSWORD.Value }}"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
  namespace: postgres-n8n
spec:
  # 2 instances: one failover standby. n8n is not latency-critical; bump to 3
  # (like authentik-db) or drop to 1 if resources matter more than failover.
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-db-app
  storage:
    storageClass: longhorn
    size: 2Gi
  walStorage:
    storageClass: longhorn
    size: 1Gi
  backup:
    target: prefer-standby
    volumeSnapshot:
      className: longhorn-backup-vsc
      snapshotOwnerReference: backup
      online: false
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: n8n-db-daily-snapshot
  namespace: postgres-n8n
  labels:
    homelab.tnndev.com/cnpg-retention: 7d
  annotations:
    homelab.tnndev.com/cnpg-retention: 7d
    backup.cnpg.io/volumeSnapshotDeadline: "30"
spec:
  schedule: "0 0 3 * * *"
  immediate: false
  backupOwnerReference: self
  method: volumeSnapshot
  online: false
  cluster:
    name: n8n-db
