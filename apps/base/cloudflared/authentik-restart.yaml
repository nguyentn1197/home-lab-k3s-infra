---
# Periodically rolls the cloudflared-authentik Deployment to force fresh
# connections to Cloudflare's edge (mitigates stale/stuck tunnel connections).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared-authentik-restart
  namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudflared-authentik-restart
  namespace: authentik
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudflared-authentik-restart
  namespace: authentik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudflared-authentik-restart
subjects:
  - kind: ServiceAccount
    name: cloudflared-authentik-restart
    namespace: authentik
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflared-authentik-restart
  namespace: authentik
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cloudflared-authentik-restart
          restartPolicy: Never
          containers:
            - name: rollout-restart
              image: alpine/k8s:1.30.14
              command:
                - /bin/sh
                - -ceu
                - |
                  kubectl rollout restart deployment/cloudflared-authentik -n authentik
