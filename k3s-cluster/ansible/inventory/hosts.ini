[masters]
k3s-master-1 ansible_host=10.10.30.21 kube_reserved_cpu=200m kube_reserved_memory=256Mi eviction_hard_memory=200Mi
k3s-master-2 ansible_host=10.10.30.22 kube_reserved_cpu=200m kube_reserved_memory=300Mi eviction_hard_memory=300Mi
k3s-master-3 ansible_host=10.10.30.23 kube_reserved_cpu=200m kube_reserved_memory=300Mi eviction_hard_memory=300Mi

[workers]
k3s-worker-1 ansible_host=10.10.30.31 kube_reserved_cpu=250m kube_reserved_memory=384Mi eviction_hard_memory=400Mi
k3s-worker-2 ansible_host=10.10.30.32 kube_reserved_cpu=250m kube_reserved_memory=384Mi eviction_hard_memory=400Mi
k3s-worker-3 ansible_host=10.10.30.33 kube_reserved_cpu=300m kube_reserved_memory=512Mi eviction_hard_memory=500Mi

[k3s_cluster:children]
masters
workers

[k3s_cluster:vars]
# The VIP that kube-vip will manage
k3s_vip=10.10.30.20
# Token shared between all K3s nodes (generate one: openssl rand -hex 32)
k3s_token=512470c385a607382eb6205d72fced9c2a874c4e1aee5e774db52857c7c477c1
# Pin workers to the same k3s version as the masters (check with: kubectl get nodes)
k3s_version=v1.34.6+k3s1
# Network interface name (check with: ip addr)
k3s_interface=eth0

[masters:vars]
k3s_service_name=k3s

[workers:vars]
k3s_service_name=k3s-agent
