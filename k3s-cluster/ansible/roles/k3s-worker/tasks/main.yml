---
# ============================================================
# K3S WORKER ROLE: Install K3s agent (worker) nodes
# ============================================================

# Workers join via the VIP (which should be stable by now, as all 3 masters are up).
# The agent binary is lighter — it only runs the kubelet and kube-proxy,
# not the control plane components.

# --- Pre-flight: detect whether K3s agent is already running ---
- name: Check if K3s agent service is active
  command: systemctl is-active k3s-agent
  register: k3s_agent_status
  changed_when: false
  failed_when: false

- name: Install K3s agent on workers
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} K3S_URL=https://{{ k3s_vip }}:6443 K3S_TOKEN={{ k3s_token }} sh -s - agent
  when: k3s_agent_status.rc != 0
  # EXPLANATION:
  # K3S_URL: Points to the VIP, so the worker connects to whichever master is currently the leader
  # K3S_TOKEN: Authentication token to join the cluster
  # INSTALL_K3S_VERSION: pins the agent to the same version as the masters. Without this,
  # get.k3s.io installs whatever is currently "stable", which can be newer than the control
  # plane and violate Kubernetes' version-skew policy (kubelet must never be newer than the
  # API server) — this bit us rebuilding worker-2, which joined on v1.36 against v1.34 masters.
  # Note: a "node-role.kubernetes.io/worker" --node-label was also dropped here. Kubelet's
  # --node-labels flag rejects any key in the reserved "kubernetes.io"/"k8s.io" namespace
  # that isn't on its allow-list, so this flag never actually took effect on any existing
  # worker (confirmed: none of them carry the label) — newer k3s/kubelet versions make this
  # a hard failure instead of a silent no-op.

# --- Format and mount the Longhorn data disk ---
# Remember the extra 100GB disk we added to workers? We need to format it
# and mount it at /var/lib/longhorn (where Longhorn stores volume data).

- name: Check if Longhorn disk exists
  stat:
    path: /dev/sdb
  register: longhorn_disk

- name: Create filesystem on Longhorn disk
  filesystem:
    fstype: ext4
    dev: /dev/sdb
  when: longhorn_disk.stat.exists

- name: Create Longhorn mount point
  file:
    path: /var/lib/longhorn
    state: directory

- name: Mount Longhorn disk
  mount:
    path: /var/lib/longhorn
    src: /dev/sdb
    fstype: ext4
    state: mounted
    opts: defaults
  when: longhorn_disk.stat.exists
